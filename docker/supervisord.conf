[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker (default, Horizon disabled)
; To enable Horizon, set HORIZON_ENABLED=true in .env and comment out this block
[program:worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker.log
stopwaitsecs=3600

; Horizon (disabled by default)
; Uncomment to use instead of simple worker
; [program:horizon]
; process_name=%(program_name)s
; command=php /var/www/html/artisan horizon
; autostart=true
; autorestart=true
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/horizon.log
; stopwaitsecs=3600

; Vite dev server (disabled - using built assets)
; [program:vite]
; command=/bin/sh -c "npm run dev -- --host 0.0.0.0"
; directory=/var/www/html
; autostart=true
; autorestart=true
; user=root
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/vite.log
; environment=NODE_ENV="development"
; startsecs=5
